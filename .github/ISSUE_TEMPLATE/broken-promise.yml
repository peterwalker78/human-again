name: Report a problem
description: An ally's app, or one of ours, stops keeping the code for allies.
title: "Problem: "
labels: ["broken promise"]
body:
  - type: input
    id: app
    attributes:
      label: App and version
    validations:
      required: true
  - type: dropdown
    id: promise
    attributes:
      label: Which promise
      options:
        - Honest and open
        - It stays on the user's computer
        - Made to be put down
        - A real tool, not an AI show
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and how we can see it too.
    validations:
      required: true
