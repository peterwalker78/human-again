name: Report a broken promise
description: An ally's app, or one of ours, breaks the code for allies.
title: "Broken promise: "
labels: ["broken promise"]
body:
  - type: input
    id: app
    attributes:
      label: App and version
    validations:
      required: true
  - type: dropdown
    id: promise
    attributes:
      label: Which promise
      options:
        - On people's side
        - Honest
        - Open, and paid for once at most
        - Nothing leaves the computer unless people ask
        - No AI features
        - Nothing is counted against anyone
        - Kindness over guilt
        - Built to be put down
        - When in doubt, people come first
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and how we can see it too.
    validations:
      required: true
